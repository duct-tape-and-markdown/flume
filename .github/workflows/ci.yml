name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # win32 support lane (spec/RELEASE-v0.4.md §6): typecheck + full suite on
  # Windows. Single lane, no matrix (§8) — POSIX remains the primary target;
  # the publish-acceptance steps stay ubuntu-only in the `ci` job.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm tsc --noEmit

      - run: pnpm test

      - run: pnpm build

      # Install smoke test (spec/RELEASE-v0.6.1.md §3): pack -> install ->
      # run the *generated* .cmd shim -> chain load. This is the lane that
      # would have caught the 0.6.0 sh.exe shim defect.
      - run: pnpm run smoke:install

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      # Publish-acceptance: the npm tarball must resolve in a fresh consumer.
      # `npm pack` does NOT run prepublishOnly, so dist/ must already exist —
      # the `pnpm build` step above produced it.

      - name: attw — declaration-file shape lint
        # flume is intentionally ESM-only ("type":"module", Node 22+, exports
        # map with only a `default` condition per §2). The esm-only profile
        # suppresses CJSResolvesToESM, which is the expected/correct shape
        # here, not a defect — see spec/RELEASE-v0.1.md §2.
        #
        # NON-BLOCKING: @arethetypeswrong/cli@0.18.2 crashes internally
        # ("Cannot read properties of undefined (reading 'filename')", exit 3)
        # pre-analysis, no finding, unreproducible locally. Declaration-shape
        # correctness is bindingly verified by the consumer-install smoke
        # below (which has caught real publish-path defects). Keep attw for
        # signal when the upstream crash is fixed.
        continue-on-error: true
        run: npx --yes @arethetypeswrong/cli@latest --pack . --profile esm-only

      - name: Consumer-install smoke
        run: |
          set -euo pipefail
          REPO="$PWD"
          TARBALL="$(node -p "const p=require('./package.json'); p.name.replace('@','').replace('/','-')+'-'+p.version+'.tgz'")"
          npm pack
          CONSUMER="$RUNNER_TEMP/flume-consumer"
          rm -rf "$CONSUMER"
          mkdir -p "$CONSUMER/.flume/prompts"
          cd "$CONSUMER"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$REPO/$TARBALL"

          # Realistic consumer chain.ts: bare-specifier import of the published
          # package (NOT ../src/ — that's the in-repo dogfood path). The value
          # import of `shellGate` forces runtime module resolution; `flume
          # render` below loads this file through tsx and would throw if the
          # package's exports map didn't resolve in a fresh project.
          cat > .flume/chain.ts <<'EOF'
          import { shellGate } from "@dtmd/flume";
          import type { Chain, Phase } from "@dtmd/flume";

          const notes: Phase = {
            name: "notes",
            description: "publish-acceptance smoke",
            promptPath: "prompts/notes.md",
            concurrency: "singleton",
            writablePaths: ["notes/**"],
            gates: [shellGate({ name: "noop", when: "afterCommit", cmd: "true", args: [] })],
            handoff: () => [],
          };

          const chain: Chain = { phases: [notes], humanOnly: [] };
          export default chain;
          EOF
          printf 'Append a dated line to notes/journal.md.\n' > .flume/prompts/notes.md

          # --no-install: the unscoped `flume` is an unrelated registry package
          # (§4) — fail loudly rather than silently run the wrong binary.
          npx --no-install flume status
          npx --no-install flume render notes >/dev/null

      - name: Consumer type-resolution gate
        # attw's binding value: can a consumer's TS compiler resolve the
        # shipped .d.ts through the exports map? Verified directly here
        # because attw@0.18.2 crashes (see the attw step). nodenext + an
        # ESM (.mts) consumer is the strict, faithful resolution mode for
        # this ESM-only package — exercises the exports `types` condition.
        # Reuses the tarball already installed by the smoke step above.
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/flume-consumer"
          npm install --no-audit --no-fund -D typescript@5 >/dev/null
          cat > tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "module": "nodenext",
              "moduleResolution": "nodenext",
              "strict": true,
              "noEmit": true,
              "skipLibCheck": true,
              "types": []
            },
            "files": ["consumer.mts"]
          }
          EOF
          cat > consumer.mts <<'EOF'
          import {
            shellGate, tscGate, partitionByFileOverlap, renderPrompt,
            Baton, Dispatcher, claudeCode,
          } from "@dtmd/flume";
          import type {
            Chain, Phase, Gate, PendingEntry,
            WorktreeSetupContext, WorktreeSetupResult,
          } from "@dtmd/flume";

          const _v: unknown[] = [
            shellGate, tscGate, partitionByFileOverlap, renderPrompt,
            Baton, Dispatcher, claudeCode,
          ];
          const _p: Phase = {
            name: "x",
            description: "type-resolution probe",
            promptPath: "p.md",
            concurrency: "singleton",
            writablePaths: [],
            gates: [],
            handoff: () => [],
          };
          type _T = [Chain, Gate, PendingEntry, WorktreeSetupContext, WorktreeSetupResult];
          void _v;
          void _p;
          void (0 as unknown as _T);
          EOF
          npx tsc --noEmit -p tsconfig.json

      - name: npm pack file-set guard
        # The packed tarball must contain exactly the package.json "files"
        # allowlist (plus package.json, which npm packs unconditionally).
        # Fails on drift in EITHER direction: a path packed but not covered by
        # "files" (over-inclusion), or a "files" entry that packs nothing
        # (under-inclusion). "files" is the single source of truth — there is
        # no .npmignore (spec/RELEASE-v0.1.md §8 L155; mechanic §4 L107).
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/check-pack.mjs" <<'EOF'
          import { readFileSync } from "node:fs";

          const pack = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const packed = (pack[0]?.files ?? []).map((f) => f.path).sort();

          const allow = (JSON.parse(readFileSync("package.json", "utf8")).files ?? [])
            .map((e) => e.replace(/\/+$/, ""));

          // npm always packs package.json regardless of "files"; it is not an
          // allowlist entry. Every other packed path must be attributable to
          // exactly one "files" entry (exact file, or directory prefix).
          const attributable = (p) =>
            p === "package.json" ||
            allow.some((r) => p === r || p.startsWith(r + "/"));

          const stray = packed.filter((p) => !attributable(p));
          const empty = allow.filter(
            (r) => !packed.some((p) => p === r || p.startsWith(r + "/")),
          );

          if (stray.length || empty.length) {
            if (stray.length) {
              console.error('over-inclusion — packed but not in "files":');
              for (const p of stray) console.error("  + " + p);
            }
            if (empty.length) {
              console.error('under-inclusion — in "files" but nothing packed:');
              for (const r of empty) console.error("  - " + r);
            }
            console.error(
              '\npackage.json "files" is the single source of truth; ' +
                "reconcile the allowlist or the build output.",
            );
            process.exit(1);
          }

          console.log(
            `npm pack file-set guard: OK (${packed.length} files packed, ` +
              'all attributable to the "files" allowlist)',
          );
          EOF
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node "$RUNNER_TEMP/check-pack.mjs" "$RUNNER_TEMP/pack.json"

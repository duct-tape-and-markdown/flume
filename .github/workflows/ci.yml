name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # win32 support lane (spec/cli.md: win32 portability): typecheck + full suite on
  # Windows. Single lane, no matrix (§8) — POSIX remains the primary target;
  # the publish-acceptance steps stay ubuntu-only in the `ci` job.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm tsc --noEmit

      - run: pnpm test

      - run: pnpm build

      # Install smoke test (spec/cli.md: distribution): pack -> install ->
      # run the *generated* .cmd shim -> chain load. This is the lane that
      # would have caught the 0.6.0 sh.exe shim defect.
      - run: pnpm run smoke:install

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm test:integration

      - run: pnpm build

      # Publish-acceptance: the npm tarball must resolve in a fresh consumer.
      # `npm pack` does NOT run prepublishOnly, so dist/ must already exist —
      # the `pnpm build` step above produced it.

      - name: attw — declaration-file shape lint
        # flume is intentionally ESM-only ("type":"module", Node 22+, exports
        # map with only a `default` condition per §2). The esm-only profile
        # suppresses CJSResolvesToESM, which is the expected/correct shape
        # here, not a defect — see spec/chain.md: the package export contract.
        #
        # NON-BLOCKING: @arethetypeswrong/cli@0.18.2 crashes internally
        # ("Cannot read properties of undefined (reading 'filename')", exit 3)
        # pre-analysis, no finding, unreproducible locally. Declaration-shape
        # correctness is bindingly verified by the consumer-install smoke
        # below (which has caught real publish-path defects). Keep attw for
        # signal when the upstream crash is fixed.
        continue-on-error: true
        run: npx --yes @arethetypeswrong/cli@latest --pack . --profile esm-only

      - name: Consumer-install smoke
        # The shared script, not a second spelling of it: pack -> install ->
        # generated shim `--version` -> both `exports` subpaths -> chain-load
        # fixture driven through a verb that refuses on a chain it cannot
        # load. This lane used to re-spell those steps inline, which is how
        # its chain-load verb drifted behind the script's on one side only,
        # and how it silently dropped the shim `--version` and subpath steps
        # while still claiming install acceptance under the Windows lane's
        # name (.claude/rules/engineering.md, "The fix lands at the
        # mechanism").
        #
        # --scratch names the directory and takes ownership of it: the
        # tarball and installed consumer this run leaves there are the
        # type-resolution gate's input below. Without the flag (the Windows
        # lane, `pnpm run smoke:install`) the script picks a temp dir and
        # removes it.
        run: node scripts/smoke-install.mjs --scratch "$RUNNER_TEMP/flume-smoke"

      - name: Consumer type-resolution gate
        # attw's binding value: can a consumer's TS compiler resolve the
        # shipped .d.ts through the exports map? Verified directly here
        # because attw@0.18.2 crashes (see the attw step). nodenext + an
        # ESM (.mts) consumer is the strict, faithful resolution mode for
        # this ESM-only package — exercises the exports `types` condition.
        # Takes the tarball scripts/smoke-install.mjs left in the --scratch
        # root above, and a consumer directory of its own — never the smoke's
        # adopted consumer, whose manifest names this package
        # (.claude/rules/platform-facts.md, "`npm install` resolves every
        # manifest range from the registry, whatever the install supplies").
        # The tarball is the handoff between the two steps; the manifest is
        # not.
        # The tarball still installs AFTER typescript: every `npm install`
        # reconciles node_modules against package.json and would prune the
        # --no-save'd package.
        run: |
          set -euo pipefail
          SCRATCH="$RUNNER_TEMP/flume-smoke"
          # Read off the scratch rather than re-derived from package.json:
          # the smoke step's own `npm pack` named this file, and a second
          # spelling of that name is a copy that can disagree. Two matches
          # collapse into a path that is no file, so the guard reds.
          TARBALL="$(ls "$SCRATCH"/*.tgz)"
          test -f "$TARBALL"
          mkdir -p "$SCRATCH/types-consumer"
          cd "$SCRATCH/types-consumer"
          npm init -y >/dev/null
          npm install --no-audit --no-fund -D typescript@5 >/dev/null
          npm install --no-audit --no-fund --no-save "$TARBALL" >/dev/null
          cat > tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "module": "nodenext",
              "moduleResolution": "nodenext",
              "strict": true,
              "noEmit": true,
              "skipLibCheck": true,
              "types": []
            },
            "files": ["consumer.mts"]
          }
          EOF
          cat > consumer.mts <<'EOF'
          import {
            shellGate, tscGate, partitionByFileOverlap, renderPrompt,
            Baton, Dispatcher, claudeCode,
          } from "@dtmd/flume";
          import type {
            Chain, Phase, Gate, PendingEntry,
            WorktreeSetupContext, WorktreeSetupResult,
          } from "@dtmd/flume";

          const _v: unknown[] = [
            shellGate, tscGate, partitionByFileOverlap, renderPrompt,
            Baton, Dispatcher, claudeCode,
          ];
          const _p: Phase = {
            name: "x",
            description: "type-resolution probe",
            promptPath: "p.md",
            concurrency: "singleton",
            writablePaths: [],
            gates: [],
            handoff: () => [],
          };
          type _T = [Chain, Gate, PendingEntry, WorktreeSetupContext, WorktreeSetupResult];
          void _v;
          void _p;
          void (0 as unknown as _T);
          EOF
          npx tsc --noEmit -p tsconfig.json

      - name: Second reference chain smoke (backlog-groomer)
        # v0.8 §7: the second reference chain is the boundary's proof — a
        # single-phase chain, no plan/build split, driven through the
        # *published* package (same rationale as "Consumer-install smoke"
        # above, self-contained per step since `run:` blocks don't share
        # shell state). Exercises §§2-4 from a second angle: its own small
        # entry extension + lowercase-kebab tag refinement (composed against
        # the same engine core cascade's ALL-CAPS convention uses), and a
        # requiresCapability-gated backlog item that must stay parked while
        # the top open item ships — one real tick, one real commit.
        #
        # The chain and its prompt are the shipped `examples/` files, copied
        # in rather than re-spelled here. The condensed heredoc this step
        # used to carry was a second spelling no typecheck read, and it went
        # on calling an engine export the api had renamed out from under it
        # while the step still claimed acceptance under its own name
        # (.claude/rules/engineering.md, "The fix lands at the mechanism").
        # Copied verbatim, `../src/index.ts` import and all: a chain's only
        # engine import is `import type`, so the loader erases it and this
        # consumer resolves no path of that name — the property that makes
        # every `examples/` chain copyable at all, exercised here.
        run: |
          set -euo pipefail
          REPO="$PWD"
          TARBALL="$(node -p "const p=require('./package.json'); p.name.replace('@','').replace('/','-')+'-'+p.version+'.tgz'")"
          npm pack
          GROOMER="$RUNNER_TEMP/flume-groomer-consumer"
          rm -rf "$GROOMER"
          mkdir -p "$GROOMER/.flume/prompts"
          cd "$GROOMER"
          npm init -y >/dev/null
          npm pkg set type=module
          # --no-save: a recorded `@dtmd/flume` dependency pins the engine
          # (v0.7 §10 amendment) and this consumer never provisions
          # `.flume/node_modules/@dtmd/flume` — an unpinned install is what
          # every other bare-bay chain (including the reference examples)
          # runs unpinned too.
          npm install --no-audit --no-fund --no-save "$REPO/$TARBALL"
          git init -q -b main
          git config user.email "ci@example.com"
          git config user.name "CI"
          git config commit.gpgsign false

          cp "$REPO/examples/backlog-groomer-chain.ts" .flume/chain.ts
          cp "$REPO/examples/prompts/backlog-groomer.md" .flume/prompts/backlog-groomer.md

          cat > BACKLOG.json <<'EOF'
          [
            {
              "tag": "rotate-secrets",
              "gate": { "kind": "requiresCapability", "capability": "ops-access" },
              "dependsOnForks": [],
              "files": {},
              "reason": "needs ops access this chain does not assert"
            },
            {
              "tag": "trim-notes-intro",
              "gate": { "kind": "open" },
              "dependsOnForks": [],
              "files": {},
              "reason": "intro paragraph restates the title"
            }
          ]
          EOF
          git add -A
          git commit -q -m seed

          npx --no-install flume wake groom
          npx --no-install flume tick

          grep -q '^- trim-notes-intro:' SHIPPED.md
          ! grep -q 'rotate-secrets' SHIPPED.md
          test "$(node -p "require('./BACKLOG.json').length")" = "1"
          test "$(git log -1 --pretty=%s)" = "groom: ship trim-notes-intro"

      - name: npm pack file-set guard
        # The packed tarball must contain exactly the package.json "files"
        # allowlist (plus package.json, which npm packs unconditionally).
        # Fails on drift in EITHER direction: a path packed but not covered by
        # "files" (over-inclusion), or a "files" entry that packs nothing
        # (under-inclusion). "files" is the single source of truth — there is
        # no .npmignore (spec/cli.md: distribution).
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/check-pack.mjs" <<'EOF'
          import { readFileSync, readdirSync } from "node:fs";

          const pack = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const packed = (pack[0]?.files ?? []).map((f) => f.path).sort();

          const entries = (JSON.parse(readFileSync("package.json", "utf8")).files ?? [])
            .map((e) => e.replace(/\/+$/, ""));

          // "files" supports negated entries ("!docs/PRD-*.md"), which subtract
          // from a broader entry rather than contributing paths of their own.
          // They are held to the opposite bar: a negation must exclude
          // something that exists, or it is stale narration passing green.
          const allow = entries.filter((e) => !e.startsWith("!"));
          const deny = entries
            .filter((e) => e.startsWith("!"))
            .map((e) => e.slice(1));

          const globToRe = (g) =>
            new RegExp(
              "^" +
                g
                  .split("*")
                  .map((s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"))
                  .join("[^/]*") +
                "$",
            );

          const onDisk = (dir) => {
            let out = [];
            for (const e of readdirSync(dir, { withFileTypes: true })) {
              const p = dir + "/" + e.name;
              if (e.isDirectory()) out = out.concat(onDisk(p));
              else out.push(p);
            }
            return out;
          };

          // npm always packs package.json regardless of "files"; it is not an
          // allowlist entry. Every other packed path must be attributable to
          // exactly one positive "files" entry (exact file, or directory
          // prefix).
          const attributable = (p) =>
            p === "package.json" ||
            allow.some((r) => p === r || p.startsWith(r + "/"));

          const stray = packed.filter((p) => !attributable(p));
          const empty = allow.filter(
            (r) => !packed.some((p) => p === r || p.startsWith(r + "/")),
          );

          // A negation that matched nothing on disk excludes nothing: the
          // subtraction it claims to perform is vacuous, and the entry reads
          // as a live exclusion while doing no work.
          const vacuous = deny.filter((g) => {
            const re = globToRe(g);
            const root = g.includes("/") ? g.slice(0, g.lastIndexOf("/")) : ".";
            let candidates;
            try {
              candidates = onDisk(root);
            } catch {
              return true;
            }
            return !candidates.some((p) => re.test(p));
          });

          // ...and one that matched on disk must actually be absent from the
          // tarball, or npm did not honor it.
          const leaked = packed.filter((p) => deny.some((g) => globToRe(g).test(p)));

          if (stray.length || empty.length || vacuous.length || leaked.length) {
            if (stray.length) {
              console.error('over-inclusion — packed but not in "files":');
              for (const p of stray) console.error("  + " + p);
            }
            if (empty.length) {
              console.error('under-inclusion — in "files" but nothing packed:');
              for (const r of empty) console.error("  - " + r);
            }
            if (leaked.length) {
              console.error('negation not honored — packed despite a "!" entry:');
              for (const p of leaked) console.error("  + " + p);
            }
            if (vacuous.length) {
              console.error('vacuous negation — "!" entry matches nothing on disk:');
              for (const g of vacuous) console.error("  ! " + g);
            }
            console.error(
              '\npackage.json "files" is the single source of truth; ' +
                "reconcile the allowlist or the build output.",
            );
            process.exit(1);
          }

          console.log(
            `npm pack file-set guard: OK (${packed.length} files packed, ` +
              `all attributable to the "files" allowlist; ` +
              `${deny.length} negation(s) verified non-vacuous)`,
          );
          EOF
          # --ignore-scripts: prepack (pnpm build) writes a script banner to
          # stdout ahead of npm's JSON; dist/ is already built by this job's
          # earlier `pnpm build` step, so re-running it here is redundant and
          # only corrupts the JSON npm pack --json emits.
          npm pack --dry-run --json --ignore-scripts > "$RUNNER_TEMP/pack.json"
          node "$RUNNER_TEMP/check-pack.mjs" "$RUNNER_TEMP/pack.json"

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # win32 support lane (spec/RELEASE-v0.4.md §6): typecheck + full suite on
  # Windows. Single lane, no matrix (§8) — POSIX remains the primary target;
  # the publish-acceptance steps stay ubuntu-only in the `ci` job.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm tsc --noEmit

      - run: pnpm test

      - run: pnpm build

      # Install smoke test (spec/RELEASE-v0.6.1.md §3): pack -> install ->
      # run the *generated* .cmd shim -> chain load. This is the lane that
      # would have caught the 0.6.0 sh.exe shim defect.
      - run: pnpm run smoke:install

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm test:integration

      - run: pnpm build

      # Publish-acceptance: the npm tarball must resolve in a fresh consumer.
      # `npm pack` does NOT run prepublishOnly, so dist/ must already exist —
      # the `pnpm build` step above produced it.

      - name: attw — declaration-file shape lint
        # flume is intentionally ESM-only ("type":"module", Node 22+, exports
        # map with only a `default` condition per §2). The esm-only profile
        # suppresses CJSResolvesToESM, which is the expected/correct shape
        # here, not a defect — see spec/RELEASE-v0.1.md §2.
        #
        # NON-BLOCKING: @arethetypeswrong/cli@0.18.2 crashes internally
        # ("Cannot read properties of undefined (reading 'filename')", exit 3)
        # pre-analysis, no finding, unreproducible locally. Declaration-shape
        # correctness is bindingly verified by the consumer-install smoke
        # below (which has caught real publish-path defects). Keep attw for
        # signal when the upstream crash is fixed.
        continue-on-error: true
        run: npx --yes @arethetypeswrong/cli@latest --pack . --profile esm-only

      - name: Consumer-install smoke
        run: |
          set -euo pipefail
          REPO="$PWD"
          TARBALL="$(node -p "const p=require('./package.json'); p.name.replace('@','').replace('/','-')+'-'+p.version+'.tgz'")"
          npm pack
          CONSUMER="$RUNNER_TEMP/flume-consumer"
          rm -rf "$CONSUMER"
          mkdir -p "$CONSUMER/.flume/prompts"
          cd "$CONSUMER"
          npm init -y >/dev/null
          # ESM consumer context — same rationale as scripts/smoke-install.mjs:
          # without type:module the chain.ts load fails as CJS before it can
          # exercise the package's exports map.
          npm pkg set type=module
          npm install --no-audit --no-fund --no-save "$REPO/$TARBALL"

          # Realistic consumer chain.ts: bare-specifier import of the published
          # package (NOT ../src/ — that's the in-repo dogfood path). The value
          # import of `shellGate` forces runtime module resolution; `flume
          # render` below loads this file through tsx and would throw if the
          # package's exports map didn't resolve in a fresh project.
          cat > .flume/chain.ts <<'EOF'
          import { shellGate } from "@dtmd/flume";
          import type { Chain, Phase } from "@dtmd/flume";

          const notes: Phase = {
            name: "notes",
            description: "publish-acceptance smoke",
            promptPath: "prompts/notes.md",
            concurrency: "singleton",
            writablePaths: ["notes/**"],
            gates: [shellGate({ name: "noop", when: "afterCommit", cmd: "true", args: [] })],
            handoff: () => [],
          };

          const chain: Chain = { phases: [notes], humanOnly: [] };
          export default chain;
          EOF
          printf 'Append a dated line to notes/journal.md.\n' > .flume/prompts/notes.md

          # --no-install: the unscoped `flume` is an unrelated registry package
          # (§4) — fail loudly rather than silently run the wrong binary.
          npx --no-install flume status
          npx --no-install flume render notes >/dev/null

      - name: Consumer type-resolution gate
        # attw's binding value: can a consumer's TS compiler resolve the
        # shipped .d.ts through the exports map? Verified directly here
        # because attw@0.18.2 crashes (see the attw step). nodenext + an
        # ESM (.mts) consumer is the strict, faithful resolution mode for
        # this ESM-only package — exercises the exports `types` condition.
        # Reuses the smoke step's consumer dir and tarball, but must
        # re-install the tarball AFTER typescript: every `npm install`
        # reconciles node_modules against package.json, pruning the
        # --no-save'd package the smoke step left behind.
        run: |
          set -euo pipefail
          REPO="$PWD"
          TARBALL="$(node -p "const p=require('./package.json'); p.name.replace('@','').replace('/','-')+'-'+p.version+'.tgz'")"
          cd "$RUNNER_TEMP/flume-consumer"
          npm install --no-audit --no-fund -D typescript@5 >/dev/null
          npm install --no-audit --no-fund --no-save "$REPO/$TARBALL" >/dev/null
          cat > tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "module": "nodenext",
              "moduleResolution": "nodenext",
              "strict": true,
              "noEmit": true,
              "skipLibCheck": true,
              "types": []
            },
            "files": ["consumer.mts"]
          }
          EOF
          cat > consumer.mts <<'EOF'
          import {
            shellGate, tscGate, partitionByFileOverlap, renderPrompt,
            Baton, Dispatcher, claudeCode,
          } from "@dtmd/flume";
          import type {
            Chain, Phase, Gate, PendingEntry,
            WorktreeSetupContext, WorktreeSetupResult,
          } from "@dtmd/flume";

          const _v: unknown[] = [
            shellGate, tscGate, partitionByFileOverlap, renderPrompt,
            Baton, Dispatcher, claudeCode,
          ];
          const _p: Phase = {
            name: "x",
            description: "type-resolution probe",
            promptPath: "p.md",
            concurrency: "singleton",
            writablePaths: [],
            gates: [],
            handoff: () => [],
          };
          type _T = [Chain, Gate, PendingEntry, WorktreeSetupContext, WorktreeSetupResult];
          void _v;
          void _p;
          void (0 as unknown as _T);
          EOF
          npx tsc --noEmit -p tsconfig.json

      - name: Second reference chain smoke (backlog-groomer)
        # v0.8 §7: the second reference chain is the boundary's proof — a
        # single-phase chain, no plan/build split, driven through the
        # *published* package (same rationale as "Consumer-install smoke"
        # above, self-contained per step since `run:` blocks don't share
        # shell state). Exercises §§2-4 from a second angle: its own small
        # entry extension + lowercase-kebab tag refinement (composed against
        # the same engine core cascade's ALL-CAPS convention uses), and a
        # requiresCapability-gated backlog item that must stay parked while
        # the top open item ships — one real tick, one real commit.
        run: |
          set -euo pipefail
          REPO="$PWD"
          TARBALL="$(node -p "const p=require('./package.json'); p.name.replace('@','').replace('/','-')+'-'+p.version+'.tgz'")"
          npm pack
          GROOMER="$RUNNER_TEMP/flume-groomer-consumer"
          rm -rf "$GROOMER"
          mkdir -p "$GROOMER/.flume/prompts"
          cd "$GROOMER"
          npm init -y >/dev/null
          npm pkg set type=module
          # --no-save: a recorded `@dtmd/flume` dependency pins the engine
          # (v0.7 §10 amendment) and this consumer never provisions
          # `.flume/node_modules/@dtmd/flume` — an unpinned install is what
          # every other bare-bay chain (including the reference examples)
          # runs unpinned too.
          npm install --no-audit --no-fund --no-save "$REPO/$TARBALL"
          git init -q -b main
          git config user.email "ci@example.com"
          git config user.name "CI"
          git config commit.gpgsign false

          # Same shape as examples/backlog-groomer-chain.ts, condensed: a
          # deterministic (non-LLM) groom agent, so this needs no API key.
          cat > .flume/chain.ts <<'EOF'
          import { execFileSync } from "node:child_process";
          import { existsSync, readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          import { z } from "zod";
          import { isPickableNow, parsePending, renderSchemaForPrompt } from "@dtmd/flume";

          const BACKLOG_PATH = "BACKLOG.json";
          const SHIPPED_PATH = "SHIPPED.md";

          const entryExtension = {
            reason: { schema: z.string().min(1).max(280), hint: `"why this item ships next"` },
            tag: {
              schema: z.string().regex(/^[a-z][a-z0-9]*(-[a-z0-9]+)*$/, "lowercase-kebab"),
              hint: `"lowercase-kebab"`,
            },
          };

          function readShippedTags(cwd) {
            const path = join(cwd, SHIPPED_PATH);
            if (!existsSync(path)) return new Set();
            const tags = new Set();
            for (const line of readFileSync(path, "utf8").split("\n")) {
              const m = /^- ([a-z0-9-]+):/.exec(line);
              if (m) tags.add(m[1]);
            }
            return tags;
          }

          const groomAgent = {
            name: "backlog-groomer",
            async invoke({ cwd }) {
              const backlogPath = join(cwd, BACKLOG_PATH);
              const parsed = parsePending(readFileSync(backlogPath, "utf8"), entryExtension);
              if (!parsed.ok) return { exitCode: 1, stdout: "", stderr: "BACKLOG.json invalid" };
              const shippedTags = readShippedTags(cwd);
              const pick = parsed.entries.find((e) => isPickableNow(e, shippedTags, undefined, new Set()));
              if (!pick) return { exitCode: 0, stdout: "nothing pickable", stderr: "" };
              const remaining = parsed.entries.filter((e) => e !== pick);
              writeFileSync(backlogPath, JSON.stringify(remaining, null, 2) + "\n");
              const shippedPath = join(cwd, SHIPPED_PATH);
              const prior = existsSync(shippedPath) ? readFileSync(shippedPath, "utf8") : "";
              writeFileSync(shippedPath, `${prior}- ${pick.tag}: ${pick.reason}\n`);
              execFileSync("git", ["add", BACKLOG_PATH, SHIPPED_PATH], { cwd });
              execFileSync("git", ["commit", "-q", "-m", `groom: ship ${pick.tag}`], { cwd });
              return { exitCode: 0, stdout: `shipped ${pick.tag}`, stderr: "" };
            },
          };

          const groom = {
            name: "groom",
            description: "Read BACKLOG.json, ship the top pickable item, commit.",
            promptPath: "prompts/backlog-groomer.md",
            concurrency: "singleton",
            agent: groomAgent,
            writablePaths: [BACKLOG_PATH, SHIPPED_PATH],
            gates: [],
            promptArgs() {
              return { BACKLOG_SCHEMA: renderSchemaForPrompt(entryExtension) };
            },
            handoff: () => [],
          };

          const chain = { phases: [groom], entryExtension, humanOnly: [], capabilities: [] };
          export default chain;
          EOF
          printf 'Groom BACKLOG.json: ship the top pickable item.\n{{BACKLOG_SCHEMA}}\n' > .flume/prompts/backlog-groomer.md

          cat > BACKLOG.json <<'EOF'
          [
            {
              "tag": "rotate-secrets",
              "gate": { "kind": "requiresCapability", "capability": "ops-access" },
              "dependsOnForks": [],
              "files": {},
              "reason": "needs ops access this chain does not assert"
            },
            {
              "tag": "trim-notes-intro",
              "gate": { "kind": "open" },
              "dependsOnForks": [],
              "files": {},
              "reason": "intro paragraph restates the title"
            }
          ]
          EOF
          git add -A
          git commit -q -m seed

          npx --no-install flume wake groom
          npx --no-install flume tick

          grep -q '^- trim-notes-intro:' SHIPPED.md
          ! grep -q 'rotate-secrets' SHIPPED.md
          test "$(node -p "require('./BACKLOG.json').length")" = "1"
          test "$(git log -1 --pretty=%s)" = "groom: ship trim-notes-intro"

      - name: npm pack file-set guard
        # The packed tarball must contain exactly the package.json "files"
        # allowlist (plus package.json, which npm packs unconditionally).
        # Fails on drift in EITHER direction: a path packed but not covered by
        # "files" (over-inclusion), or a "files" entry that packs nothing
        # (under-inclusion). "files" is the single source of truth — there is
        # no .npmignore (spec/RELEASE-v0.1.md §8 L155; mechanic §4 L107).
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/check-pack.mjs" <<'EOF'
          import { readFileSync } from "node:fs";

          const pack = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const packed = (pack[0]?.files ?? []).map((f) => f.path).sort();

          const allow = (JSON.parse(readFileSync("package.json", "utf8")).files ?? [])
            .map((e) => e.replace(/\/+$/, ""));

          // npm always packs package.json regardless of "files"; it is not an
          // allowlist entry. Every other packed path must be attributable to
          // exactly one "files" entry (exact file, or directory prefix).
          const attributable = (p) =>
            p === "package.json" ||
            allow.some((r) => p === r || p.startsWith(r + "/"));

          const stray = packed.filter((p) => !attributable(p));
          const empty = allow.filter(
            (r) => !packed.some((p) => p === r || p.startsWith(r + "/")),
          );

          if (stray.length || empty.length) {
            if (stray.length) {
              console.error('over-inclusion — packed but not in "files":');
              for (const p of stray) console.error("  + " + p);
            }
            if (empty.length) {
              console.error('under-inclusion — in "files" but nothing packed:');
              for (const r of empty) console.error("  - " + r);
            }
            console.error(
              '\npackage.json "files" is the single source of truth; ' +
                "reconcile the allowlist or the build output.",
            );
            process.exit(1);
          }

          console.log(
            `npm pack file-set guard: OK (${packed.length} files packed, ` +
              'all attributable to the "files" allowlist)',
          );
          EOF
          # --ignore-scripts: prepack (pnpm build) writes a script banner to
          # stdout ahead of npm's JSON; dist/ is already built by this job's
          # earlier `pnpm build` step, so re-running it here is redundant and
          # only corrupts the JSON npm pack --json emits.
          npm pack --dry-run --json --ignore-scripts > "$RUNNER_TEMP/pack.json"
          node "$RUNNER_TEMP/check-pack.mjs" "$RUNNER_TEMP/pack.json"
